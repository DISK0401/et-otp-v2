cli.waiting=コードが {0} 秒後に変わるため、次のコードを待っています...
cli.noClipboard=クリップボードがないため、コピーできません。
cli.trailingSpace=パスワードの末尾に空白があります。cmd の「echo パスワード | ...」は、「|」の前の空白も渡します。「echo パスワード| ...」のように、空白を入れずに書いてください。
