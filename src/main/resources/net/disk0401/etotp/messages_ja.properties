about.title={0} のバージョン情報
about.heading={0} TOTP ジェネレーター
about.text1=TOTP（RFC 6238）の時間ベースのワンタイムパスワードを生成します。
about.text2=Base32 形式のシークレットを登録して使うソフトトークンです。Amazon AWS、Dropbox、GitHub、Google、Microsoft などの 2 段階認証で使えます。
about.text3=et-OTP-v2 は、Bernd Eckenfels 氏の et-otp を元に DISK0401 が開発しているソフトウェアです。HOTP（RFC 4226）のリファレンス実装、Google Authenticator プロジェクトの Base32 実装、Daniel Beer 氏の QR コード解析ライブラリ quirc（ISC ライセンス）を Java に移植したコードを含みます。
