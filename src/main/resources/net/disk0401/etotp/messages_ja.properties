wizard.intro.heading={0} の初期設定
wizard.intro.text1={0} は、2 段階認証で使うワンタイムパスワード（TOTP）を表示します。スマートフォンの認証アプリと同じように使えます。
wizard.intro.text2=使い始めるには、サービスで 2 段階認証を有効にするときに表示されるシークレットの登録が必要です。サービスが QR コードを表示した場合は、キーを手動で入力する方法を選んでください。シークレットが文字列で表示されます。
wizard.intro.text3=シークレットは、これから決めるパスワードで暗号化して、次のファイルに保存します。
wizard.secret.text=サービスに表示されたシークレットを入力してください。使える文字は A～Z と 2～7 です。空白とハイフンは入力しても無視します。
wizard.secret.label=シークレット（Base32）：
wizard.password.text=シークレットを解除するためのパスワードを決めてください。コードを表示するたびに入力します。パスワードを忘れた場合は、シークレットを登録し直す必要があります。
