cli.usage=使い方：\n  et-otp-v2 --code <名前> [オプション]   サービス <名前> の現在のコードを出力します\n  et-otp-v2 --list [オプション]          登録したサービスの名前を出力します\n  et-otp-v2 --version                  バージョンを出力します\n  et-otp-v2 --help                     この説明を表示します\nオプション：\n  --copy             コードを出力せずに、クリップボードにコピーします（--code だけ）\n  --next             次の期間のコードを出力します（--code だけ）\n  --json             結果を JSON で出力します。--code では、コード、残り秒数、次のコードを出力します\n  --password-stdin   パスワードを標準入力の 1 行目から読みます\n  --config <ファイル>  この設定ファイルを使います\n--json は、--copy や --next と一緒には使えません。\nオプションを付けない場合は、ウィンドウを開きます。コードが 3 秒以内に変わる場合は、次のコードに変わるまで待ってから出力します（--next を除く）。\n終了コード：0 成功、1 失敗、2 オプションの誤り
cli.noConfig=設定ファイルがありません：{0}\n先に et-OTP-v2 を起動して、初期設定を済ませてください。
cli.legacy=設定ファイルの形式が古いため、読み込めません：{0}\net-OTP-v2 のウィンドウで一度開くと、新しい形式に変換されます。
