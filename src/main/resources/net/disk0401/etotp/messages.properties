wizard.intro.heading=Welcome to {0}
wizard.intro.text1={0} shows the one-time passwords (TOTP) for 2-step verification, like an authenticator app on a smartphone.
wizard.intro.text2=To use it, store the secret that a service shows when you turn on 2-step verification. If the service shows a QR code, choose the option to enter the key manually: the service then shows the secret as text.
wizard.intro.text3=The secret is encrypted with a password that you choose and saved in this file:
wizard.secret.text=Enter the secret that the service shows. It consists of the letters A to Z and the digits 2 to 7. Spaces and hyphens are ignored.
wizard.secret.label=Secret (Base32):
wizard.password.text=Choose the password that unlocks the secret. You enter it each time you show a code. If you forget it, you have to store the secret again.
