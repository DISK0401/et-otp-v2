about.title=About {0}
about.heading={0} TOTP Generator
about.text1=This generator produces TOTP (RFC 6238) time-based one-time passwords.
about.text2=It is a so-called soft token that is initialized with a Base32 secret. This method is compatible with the 2-step verification of Amazon AWS, Dropbox, GitHub, Google, Microsoft and others.
about.text3=et-OTP-v2 is developed by DISK0401, based on et-otp by Bernd Eckenfels. It includes a Java port of the QR code decoder quirc by Daniel Beer (ISC license).
