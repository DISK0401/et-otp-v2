cli.ambiguous=Several services are named "{0}". Give them different names in et-OTP-v2.
cli.waiting=The code changes in {0} seconds. Waiting for the next code...
cli.noClipboard=Cannot copy, as there is no clipboard.
cli.trailingSpace=The password ends with a space. In cmd, "echo password | ..." also passes the space before the "|": write "echo password| ..." instead.
cli.noStdin=No password was given on the standard input.

