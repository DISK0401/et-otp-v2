cli.usage=Usage:\n  et-otp-v2 --code <name> [options]   writes the current code of the service <name>\n  et-otp-v2 --list [options]          writes the names of the registered services\n  et-otp-v2 --version                 writes the version\n  et-otp-v2 --help                    shows this help\nOptions:\n  --copy             copies the code to the clipboard instead of writing it (--code only)\n  --next             writes the code of the next period (--code only)\n  --json             writes the result as JSON; for --code with the code, the seconds left and the next code\n  --password-stdin   reads the password from the first line of the standard input\n  --config <file>    uses this configuration file\n--json cannot be combined with --copy or --next.\nWithout options, the window opens. If the code changes within 3 seconds, the next code is waited for and written (not with --next).\nExit code: 0 done, 1 failed, 2 wrong options.
cli.noConfig=There is no configuration file: {0}\nStart et-OTP-v2 and finish the setup first.
cli.legacy=The configuration file has an old format and cannot be read: {0}\nOpen it once in the et-OTP-v2 window to convert it to the new format.
cli.noConsole=Cannot ask for the password, as there is no console.
