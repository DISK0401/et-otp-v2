name: Release check

# Required status check for pull requests into main: merging into main creates a release,
# so the version must be a new, non-SNAPSHOT release version.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check release version
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::Pull requests into main must come from develop (got '$HEAD_REF')."
            exit 1
          fi
          version="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "Version: $version"
          if ! [[ "$version" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$version' is not a release version like 2.0.0. Set it on develop with: mvn versions:set -DnewVersion=X.Y.Z -DgenerateBackupFiles=false"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          echo "### Merging this PR creates the draft release v$version" >> "$GITHUB_STEP_SUMMARY"
