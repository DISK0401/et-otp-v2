name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -e verify
      - name: Check for APIs deprecated for removal
        # The jar targets Java 17 (--release 17), so the compiler cannot see APIs that later
        # Java versions deprecate for removal. Scan against the newest supported release.
        if: matrix.java == '25'
        run: |
          out="$(jdeprscan -J-Duser.language=en -J-Duser.country=US --release 25 --for-removal target/et-otp-*.jar 2>&1)"
          echo "$out"
          if printf '%s\n' "$out" | grep -v '^Jar file ' | grep -q .; then
            echo "::error::The jar uses APIs that are deprecated for removal in Java 25."
            exit 1
          fi
      - name: Upload jar
        if: matrix.java == '25'
        uses: actions/upload-artifact@v7
        with:
          name: et-otp-jar
          path: target/*.jar
